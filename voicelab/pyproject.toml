[project]
name = "voicelab"
version = "0.1.0"
description = "Test StoryClient voice DSP (pitch/gain/low-pass/tone) against ElevenLabs TTS without launching Minecraft"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "requests>=2.31",
    "soundfile>=0.12",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
]
